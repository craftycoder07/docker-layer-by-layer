<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Layer by Layer — an interactive Docker course</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f4ebe0; --paper2:#ece1d2; --card:#fbf6ef; --ink:#1f1a17; --muted:#6b5f55;
  --blue:#2f6fdb; --orange:#e0703a; --green:#3d8a5a; --red:#c9463d; --purple:#7a5ccc; --yellow:#d79b1c;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:'Space Grotesk',system-ui,sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}

/* top bar */
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:16px;padding:12px 24px;background:rgba(244,235,224,.92);backdrop-filter:blur(6px);border-bottom:2px solid var(--ink)}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:'Fraunces',serif;font-weight:800;font-size:21px;letter-spacing:-.01em}
.logo svg{width:30px;height:30px}
.top .spacer{flex:1}
.prog{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.prog .bar{width:110px;height:8px;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden;background:var(--card)}
.prog .bar i{display:block;height:100%;background:var(--green);transition:width .4s}

/* home */
.home{max-width:1120px;margin:0 auto;padding:48px 24px 80px}
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:32px;align-items:center;margin-bottom:56px}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--orange);font-weight:600}
.hero h1{font-family:'Fraunces',serif;font-weight:800;font-size:clamp(40px,6vw,68px);line-height:1;letter-spacing:-.025em;margin:10px 0 18px}
.hero h1 em{font-style:normal;color:var(--blue)}
.hero p{font-size:19px;color:#3b332d;max-width:540px;margin:0 0 26px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border:2px solid var(--ink);border-radius:10px;background:var(--ink);color:var(--paper);font-weight:600;text-decoration:none;box-shadow:4px 4px 0 var(--orange);transition:transform .12s, box-shadow .12s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--orange)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:4px 4px 0 var(--ink)}
.hero-art svg{width:100%;height:auto;overflow:visible}
.hero-art .lay{animation:float 4s ease-in-out infinite}
.hero-art .lay:nth-child(2){animation-delay:-.6s}.hero-art .lay:nth-child(3){animation-delay:-1.2s}.hero-art .lay:nth-child(4){animation-delay:-1.8s}
@keyframes float{50%{transform:translateY(-6px)}}
.section-h{display:flex;align-items:baseline;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:22px}
.section-h h2{font-family:'Fraunces',serif;font-size:28px;margin:0}
.section-h span{font-size:14px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{position:relative;display:block;text-decoration:none;background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:18px 18px 16px;box-shadow:5px 5px 0 var(--ink);transition:transform .12s, box-shadow .12s}
.card:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--ink)}
.card .num{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted)}
.card h3{font-family:'Fraunces',serif;font-size:21px;line-height:1.15;margin:6px 0 6px}
.card p{margin:0;font-size:14.5px;color:#4a4039}
.card .meta{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:12.5px}
.tag{display:inline-block;padding:2px 9px;border:1.5px solid var(--ink);border-radius:20px;font-weight:600;font-size:11.5px;letter-spacing:.03em}
.t-Foundations{background:#e6dccd}.t-Build{background:#d3e1fb}.t-Run{background:#d2e8d8}.t-Ship{background:#f6e3ad}.t-Scale{background:#e2d9f6}
.done-badge{color:var(--green);font-weight:700}
.howto{margin-top:56px;display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.howto div{border-top:2px solid var(--ink);padding-top:12px}
.howto b{font-family:'Fraunces',serif;font-size:19px;display:block;margin-bottom:4px}
.howto p{margin:0;color:#4a4039;font-size:15px}
kbd{font-family:'JetBrains Mono',monospace;font-size:12px;border:1.5px solid var(--ink);border-bottom-width:3px;border-radius:5px;padding:0 5px;background:var(--card)}

/* lesson layout */
.lesson{display:grid;grid-template-columns:250px minmax(0,1fr);max-width:1240px;margin:0 auto}
.side{position:sticky;top:58px;align-self:start;height:calc(100vh - 58px);overflow:auto;padding:26px 14px 26px 24px;border-right:2px solid var(--ink)}
.side h4{font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.side a{display:flex;gap:10px;align-items:baseline;padding:7px 10px;border-radius:8px;text-decoration:none;font-size:14.5px;line-height:1.3;border:1.5px solid transparent}
.side a:hover{background:var(--paper2)}
.side a.cur{background:var(--card);border-color:var(--ink);box-shadow:3px 3px 0 var(--ink);font-weight:600}
.side a .n{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--muted);min-width:18px}
.side a .ck{margin-left:auto;color:var(--green);font-weight:700}
.main{padding:30px 32px 80px;min-width:0}
.crumb{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.main h1{font-family:'Fraunces',serif;font-weight:800;font-size:clamp(30px,4.2vw,46px);line-height:1.05;letter-spacing:-.02em;margin:0 0 8px}
.lede{font-size:18px;color:#3b332d;margin:0 0 22px;max-width:720px}
.stage{background:var(--card);border:2px solid var(--ink);border-radius:16px;box-shadow:7px 7px 0 var(--ink);overflow:hidden}
.canvas{background-color:#fbf6ef;background-image:radial-gradient(#d9ccbb 1.1px,transparent 1.2px);background-size:20px 20px;overflow-x:auto;border-bottom:2px solid var(--ink)}
.canvas{position:relative}
.canvas svg{display:block;width:100%;height:auto}
.canvas.zoom svg{min-width:780px}
.zoombtn{display:none;position:sticky;left:8px;top:8px;margin:8px 0 -38px 8px;z-index:2;font-family:'JetBrains Mono',monospace;font-size:11.5px;padding:4px 9px;border:1.5px solid var(--ink);border-radius:8px;background:var(--card)}
.caption{display:grid;grid-template-columns:auto 1fr;gap:18px;padding:18px 22px 6px;min-height:118px}
.stepno{font-family:'Fraunces',serif;font-size:40px;font-weight:800;line-height:1;color:var(--orange)}
.stepno small{display:block;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);font-weight:400;margin-top:4px;text-align:center}
.caption h3{margin:2px 0 4px;font-size:20px;line-height:1.25}
.caption p{margin:0;color:#3b332d;font-size:16px;max-width:760px}
.caption .fade{animation:fadeIn .35s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}}
.controls{display:flex;align-items:center;gap:10px;padding:12px 22px 18px;flex-wrap:wrap}
.cbtn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border:2px solid var(--ink);border-radius:10px;background:var(--card);font-weight:600;font-size:14.5px;box-shadow:3px 3px 0 var(--ink);transition:transform .1s, box-shadow .1s}
.cbtn:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.cbtn:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.cbtn:disabled{opacity:.35;cursor:default}
.cbtn.primary{background:var(--ink);color:var(--paper);box-shadow:3px 3px 0 var(--orange)}
.dots{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.dots button{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--ink);background:transparent;padding:0}
.dots button.past{background:var(--ink)}
.dots button.cur{background:var(--orange);transform:scale(1.25)}
.term{margin-top:22px;background:#1f1a17;color:#efe5d8;border:2px solid var(--ink);border-radius:14px;box-shadow:7px 7px 0 var(--blue);overflow:hidden}
.term-bar{display:flex;align-items:center;gap:7px;padding:9px 14px;border-bottom:1px solid #3a322c;font-family:'JetBrains Mono',monospace;font-size:12px;color:#a89a8b}
.term-bar i{width:11px;height:11px;border-radius:50%;background:#e0703a}.term-bar i:nth-child(2){background:#d79b1c}.term-bar i:nth-child(3){background:#3d8a5a}
.term-bar span{margin-left:8px}
.term-bar .copy{margin-left:auto;background:none;border:1px solid #5a4f46;border-radius:6px;color:#efe5d8;font-family:'JetBrains Mono',monospace;font-size:11.5px;padding:3px 9px}
.term pre{margin:0;padding:14px 18px 18px;font-family:'JetBrains Mono',monospace;font-size:13.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word;min-height:96px;max-height:260px;overflow:auto}
.term .old{opacity:.42}
.term .p{color:#7fd29a}.term .o{color:#a89a8b}.term .c{color:#8a7d70}
.cursor{display:inline-block;width:8px;height:15px;background:#efe5d8;vertical-align:-2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.pager{display:flex;justify-content:space-between;gap:14px;margin-top:34px}
.pager a{flex:1;max-width:48%;text-decoration:none;border:2px solid var(--ink);border-radius:12px;padding:12px 16px;background:var(--card);box-shadow:4px 4px 0 var(--ink)}
.pager a small{display:block;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted)}
.pager a b{font-family:'Fraunces',serif;font-size:18px}
.pager a.next{text-align:right;margin-left:auto}
.hint{font-size:13px;color:var(--muted);margin-top:14px}

/* svg diagram styling */
.canvas svg text{font-family:'Space Grotesk',sans-serif;fill:var(--ink)}
.canvas svg text.mono{font-family:'JetBrains Mono',monospace}
.canvas svg text.muted{fill:var(--muted)}
.canvas svg text.cap{font-family:'JetBrains Mono',monospace;font-weight:600;letter-spacing:.06em;fill:var(--muted)}
.canvas svg text.lbl{paint-order:stroke;stroke:#fbf6ef;stroke-width:5px;stroke-linejoin:round}
.bx .sh{fill:var(--ink)}
.bx .bd{stroke:var(--ink);stroke-width:1.6}
.hl>.bd{stroke:var(--orange);stroke-width:3.2}
.hl>.sh{fill:var(--orange)}
.frr{stroke:var(--ink);stroke-width:1.4;stroke-dasharray:7 6}
.ar{fill:none;stroke-width:1.9}
.dash{stroke-dasharray:6 5;animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-22}}
.divider{stroke:var(--ink);stroke-width:1.2;stroke-dasharray:3 6}
.cl .clbg{fill:rgba(224,112,58,.38);opacity:0;transition:opacity .3s}
.cl.hl .clbg{opacity:1}
[data-in],[data-out]{opacity:0;transform:translateY(7px);transition:opacity .45s ease, transform .45s ease;transform-box:fill-box;transform-origin:center}
.on{opacity:1;transform:none}
.hl{transform-box:fill-box;transform-origin:center;animation:pop .55s ease}
@keyframes pop{0%{transform:scale(1.06)}100%{transform:none}}


/* stack picker */
.stackpick{position:relative}
.stackbtn{display:flex;align-items:center;gap:8px;padding:6px 12px;border:2px solid var(--ink);border-radius:10px;background:var(--card);font-weight:600;font-size:14px;box-shadow:3px 3px 0 var(--ink)}
.stackbtn b{font-size:11px}
.sdot{display:inline-block;width:10px;height:10px;border-radius:50%;border:1.5px solid var(--ink);flex:none}
.stackmenu{position:absolute;right:0;top:calc(100% + 10px);width:250px;background:var(--card);border:2px solid var(--ink);border-radius:12px;box-shadow:5px 5px 0 var(--ink);padding:6px;z-index:30}
.stackmenu[hidden]{display:none}
.stackmenu button{display:flex;width:100%;align-items:center;gap:10px;padding:8px 10px;border:0;background:none;border-radius:8px;text-align:left;font-weight:600;font-size:14.5px}
.stackmenu button:hover,.stackmenu button.cur{background:var(--paper2)}
.stackmenu small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.stackmenu button b{margin-left:auto;color:var(--green)}
.stackrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 26px}
.stackrow>span{font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.schip{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border:2px solid var(--ink);border-radius:20px;background:var(--card);font-weight:600;font-size:14px;transition:transform .1s}
.schip:hover{transform:translateY(-1px)}
.schip.cur{background:var(--ink);color:var(--paper)}
.stackinline{display:inline-flex;align-items:center;gap:6px;border:1.5px dashed var(--ink);background:none;border-radius:20px;padding:2px 10px;font-size:12.5px;font-weight:600}
.stackinline.neutral{color:var(--muted);font-weight:500}
.term .f{color:#f0c38e}
.toast{position:fixed;bottom:22px;left:50%;background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:10px;font-size:14px;font-weight:600;z-index:50;box-shadow:4px 4px 0 var(--orange);animation:toast 2.2s ease forwards;pointer-events:none}
@keyframes toast{0%{opacity:0;transform:translate(-50%,8px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,0)}}

@media (max-width:900px){
  .hero{grid-template-columns:1fr}
  .hero-art{max-width:380px}
  .howto{grid-template-columns:1fr}
  .lesson{grid-template-columns:1fr}
  .side{position:static;height:auto;border-right:0;border-bottom:2px solid var(--ink);padding:12px 16px;display:flex;gap:6px;overflow-x:auto}
  .side h4{display:none}
  .side a{flex:0 0 auto;font-size:13px;padding:6px 10px}
  .main{padding:22px 16px 60px}
  .top{padding:10px 16px}
  .prog .bar{width:60px}
  #progTxt{display:none}
  .logo{font-size:18px}
  .top{gap:10px}
  .stackbtn{padding:5px 9px;font-size:13px}
  .crumb{flex-wrap:wrap}
  .caption{padding:16px 16px 4px;gap:12px}
  .controls{padding:10px 16px 16px}
  .dots{margin-left:0;width:100%}
  .zoombtn{display:inline-block}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <a class="logo" href="#home">
    <svg viewBox="0 0 32 32"><rect x="5" y="19" width="22" height="7" rx="2" fill="#e6dccd" stroke="#1f1a17" stroke-width="2"/><rect x="5" y="11" width="22" height="7" rx="2" fill="#d3e1fb" stroke="#1f1a17" stroke-width="2"/><rect x="5" y="3" width="22" height="7" rx="2" fill="#e0703a" stroke="#1f1a17" stroke-width="2"/></svg>
    Layer by Layer
  </a>
  <span class="spacer"></span>
  <div class="stackpick"><button class="stackbtn" id="stackBtn" aria-haspopup="true" aria-expanded="false"><i class="sdot" id="stackDot"></i><span id="stackName">Node.js</span><b>▾</b></button><div class="stackmenu" id="stackMenu" hidden></div></div>
  <div class="prog"><span id="progTxt">0 / 10</span><span class="bar"><i id="progBar" style="width:0"></i></span></div>
</header>
<div id="app"></div>

<script>
/* ---------- palette ---------- */
const COL={gray:'#e6dccd',blue:'#d3e1fb',orange:'#f8d6c1',green:'#d2e8d8',yellow:'#f6e3ad',purple:'#e2d9f6',red:'#f5cdc8',white:'#fffaf3'};
const SOL={blue:'#2f6fdb',orange:'#e0703a',green:'#3d8a5a',yellow:'#d79b1c',purple:'#7a5ccc',red:'#c9463d',ink:'#1f1a17',gray:'#8a7d70'};

/* ---------- svg helpers ---------- */
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function V(o){let s='';if(o.in!=null)s+=` data-in="${o.in}"`;if(o.out!=null)s+=` data-out="${o.out}"`;if(o.hl!=null)s+=` data-hl="${[].concat(o.hl).join(' ')}"`;return s;}
function boxText(x,y,w,h,label,o){
  const fs=o.fs||15,sfs=o.sfs||12,lh=fs*1.2,slh=sfs*1.3;
  const lines=label?String(label).split('\n'):[],subs=o.sub?String(o.sub).split('\n'):[];
  const tot=lines.length*lh+subs.length*slh;let top=y+h/2-tot/2,t='';
  const cx=o.left?x+12:x+w/2,an=o.left?'start':'middle';
  lines.forEach((l,i)=>{t+=`<text x="${cx}" y="${(top+i*lh+fs*.88).toFixed(1)}" font-size="${fs}" text-anchor="${an}" font-weight="${o.w||600}"${o.mono?' class="mono"':''}>${esc(l)}</text>`});
  top+=lines.length*lh;
  subs.forEach((l,i)=>{t+=`<text x="${cx}" y="${(top+i*slh+sfs*.95).toFixed(1)}" font-size="${sfs}" text-anchor="${an}" class="muted${o.smono?' mono':''}">${esc(l)}</text>`});
  return t;
}
function B(x,y,w,h,label,o={}){
  const r=o.r??7,dash=o.dashed?' stroke-dasharray="6 5"':'';
  const sh=o.noshadow?'':`<rect class="sh" x="${x+4}" y="${y+4}" width="${w}" height="${h}" rx="${r}"/>`;
  const head=o.head?`<text x="${x+14}" y="${y+26}" font-size="${o.hfs||14}" font-weight="700">${esc(o.head)}</text>`:'';
  return `<g class="bx"${V(o)}>${sh}<rect class="bd" x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${COL[o.c||'white']}"${dash}/>${head}${boxText(x,y,w,h,label,o)}${o.extra||''}</g>`;
}
function FR(x,y,w,h,title,o={}){
  return `<g${V(o)}><rect class="frr" x="${x}" y="${y}" width="${w}" height="${h}" rx="12" fill="${o.c?COL[o.c]:'none'}" fill-opacity=".55"/><text x="${x+14}" y="${y+21}" font-size="11.5" class="cap">${esc(title)}</text>${o.extra||''}</g>`;
}
function T(x,y,s,o={}){
  const fs=o.fs||14;
  return `<g${V(o)}>${String(s).split('\n').map((l,i)=>`<text x="${x}" y="${y+i*fs*1.28}" font-size="${fs}" text-anchor="${o.a==='middle'?'middle':o.a==='end'?'end':'start'}" font-weight="${o.w||400}"${o.cls?` class="${o.cls}"`:''}${o.fill?` style="fill:${o.fill}"`:''}${o.rot?` transform="rotate(${o.rot} ${x} ${y})"`:''}>${esc(l)}</text>`).join('')}</g>`;
}
function A(d,o={}){
  const c=o.c||'ink';
  const lbl=o.label?`<text x="${o.lx}" y="${o.ly}" font-size="${o.fs||12.5}" text-anchor="${o.la||'middle'}" font-weight="600" class="lbl${o.mono?' mono':''}">${esc(o.label)}</text>`:'';
  return `<g${V(o)}><path d="${d}" class="ar${o.dash?' dash':''}" style="stroke:${SOL[c]}" marker-end="url(#ah-${c})"${o.both?` marker-start="url(#ah-${c})"`:''}/>${lbl}</g>`;
}
function P(d,o={}){
  const fill=SOL[o.c||'orange'];
  const shape=o.sq?`<rect x="-7" y="-7" width="14" height="14" rx="2" fill="${fill}" stroke="#1f1a17" stroke-width="1.5">`:`<circle r="${o.r||6}" fill="${fill}" stroke="#1f1a17" stroke-width="1.5">`;
  return `<g${V(o)}>${shape}<animateMotion dur="${o.dur||'1.8s'}" begin="${o.begin||'0s'}" repeatCount="indefinite" path="${d}"/>${o.sq?'</rect>':'</circle>'}</g>`;
}
function CY(x,y,w,h,label,o={}){
  const ry=o.ry||10,f=COL[o.c||'blue'];
  const p=(x,y)=>`M${x},${y+ry} A${w/2},${ry} 0 0 0 ${x+w},${y+ry} V${y+h-ry} A${w/2},${ry} 0 0 1 ${x},${y+h-ry} Z`;
  const tt=o.ty!=null?boxText(x,o.ty-20,w,40,label,o):boxText(x,y+ry,w,h-ry,label,o);
  return `<g class="bx"${V(o)}><path class="sh" d="${p(x+4,y+4)}"/><path class="bd" d="${p(x,y)}" fill="${f}"/><ellipse class="bd" cx="${x+w/2}" cy="${y+ry}" rx="${w/2}" ry="${ry}" fill="${f}"/>${tt}${o.extra||''}</g>`;
}
function hilite(t){
  let s=esc(t);
  if(/^\s*#/.test(t))return `<tspan style="fill:#8a7d70">${s}</tspan>`;
  s=s.replace(/^(\s*)(FROM|WORKDIR|COPY|RUN|CMD|ENTRYPOINT|USER|ENV|EXPOSE|ARG|HEALTHCHECK)\b/,'$1<tspan style="fill:#f0a272">$2</tspan>');

 {t:'Same hardware, two strategies',d:'Every server has hardware and a host operating system with one kernel. The question is how to isolate many apps on top of it.',cmd:'docker version'},
 {t:'VMs virtualize the hardware',d:'A hypervisor carves the machine into virtual machines. Each VM boots a full guest OS and kernel just to run one app.'},

steps:S=>{const C=S.cache;return[
 {t:'One tiny edit, then rebuild',d:'Docker reuses a cached layer only if the instruction and its inputs are unchanged. For COPY, the inputs are the checksums of the files being copied.',cmd:`echo "${S.comment} tweak" >> ${S.src}`},
 {t:'COPY . . sees a change',d:'Your edit changes the checksum of everything in COPY . . — so that layer has to be rebuilt.',cmd:'docker build -t myapp .'},
 {t:'Misses cascade downward',d:`Once one layer is rebuilt, every layer after it is too: ${C.cascade}, even though ${S.manifest} never changed.`,cmd:'> '+C.badOut},
 {t:'Reorder: dependencies first',d:`Copy only ${S.manifest} first, restore dependencies, then copy the source. An edit now invalidates only the layers after the source copy${S.compiled?' — the compile still runs, but against cached dependencies':''}.${C.note}`,cmd:'docker build -t myapp .\n> '+C.goodOut},
 {t:'Trim the build context',d:`A .dockerignore keeps ${C.ignore.join(', ')} and secrets out of the build context: less to upload, less to checksum, nothing sensitive in a layer.`,cmd:`printf "${C.ignore.join('\\n')}\\n" > .dockerignore`}
]}},

steps:S=>[
 {t:'Start with an image',d:`An image is an inert template: your ${S.name} app’s layers plus a default command. Nothing is running yet.`,cmd:'docker image ls myapp'},
 {t:'create: prepare a container',d:'Docker allocates the writable layer, network settings and config — but starts no process.',cmd:'docker create --name api myapp:1.0'},
 {t:'start: your process becomes PID 1',d:'The image’s start command runs inside its namespaces as PID 1. When that process exits, the container exits.',cmd:'docker start api'},
 {t:'pause / unpause',d:'The cgroup freezer suspends every process in place — memory kept, CPU released.',cmd:'docker pause api && docker unpause api'},
 {t:'stop: graceful, then forced',d:`Docker sends SIGTERM, waits 10 s, then SIGKILL (exit code 137). ${S.sigterm}`,cmd:'docker stop api\ndocker ps -a'},
 {t:'Restart policies',d:'With --restart unless-stopped (or on-failure), the daemon brings a crashed container straight back to Running.',cmd:'docker update --restart unless-stopped api'},
 {t:'rm: gone for good',d:'Removing a container deletes its writable layer. Anything not in a volume is lost — which is exactly the next lesson.',cmd:'docker rm api'}
]},

steps:S=>[
 {t:'Containers write to their own layer',d:'By default Postgres stores its data files inside the container’s writable layer.',cmd:'docker run -d --name db -e POSTGRES_PASSWORD=pw postgres:16'},
 {t:'Remove the container, lose the data',d:'The writable layer lives and dies with the container. docker rm takes your database with it.',cmd:'docker rm -f db'},
 {t:'Named volumes live outside',d:'A volume is storage managed by Docker on the host. Mount it at the data path and writes go there instead.',cmd:'docker run -d --name db -e POSTGRES_PASSWORD=pw \\\n  -v pgdata:/var/lib/postgresql/data postgres:16'},
 {t:'Containers are disposable, volumes are not',d:'Delete and recreate the container — say, to upgrade the image. Mount the same volume and the data is right where you left it.',cmd:'docker rm -f db\ndocker run -d --name db -e POSTGRES_PASSWORD=pw \\\n  -v pgdata:/var/lib/postgresql/data postgres:16'},
 {t:'Bind mounts for development',d:`A bind mount maps a host folder straight into the container. Run ${S.dev.reload} inside it, edit in your IDE, and the app reloads — no image rebuild.`,cmd:S.dev.cmd},
 {t:'tmpfs for scratch & secrets',d:'A tmpfs mount lives only in memory: never written to disk, gone when the container stops.',cmd:'docker run -d --tmpfs /tmp myapp'}
]},

steps:S=>[
 {t:'Every container gets its own network stack',d:'On a user-defined network, each container gets a private IP, its own ports, and a virtual link to a bridge on the host.',cmd:'docker network create appnet\ndocker run -d --name web --network appnet nginx'},
 {t:'Private by default',d:'Those 172.18.x.x addresses exist only inside the host. Your browser can’t reach the container’s port 80 directly.',cmd:'curl http://172.18.0.2      # from your laptop\n> curl: (28) Connection timed out'},
 {t:'Publish a port',d:'-p 8080:80 tells Docker to forward traffic hitting the host on 8080 into the container on port 80.',cmd:'docker run -d --name web --network appnet -p 8080:80 nginx'},
 {t:'Containers find each other by name',d:`Docker’s embedded DNS resolves container names on user-defined networks. The ${S.name} api uses “db” as the host — ${S.conn} — no hard-coded IPs.`,cmd:`docker run -d --name api --network appnet myapp:1.0\ndocker exec api getent hosts db\n> 172.18.0.4      db`},
 {t:'Expose only the front door',d:`Publish only what users need. The api listens on ${S.port} and the database on 5432, but neither has -p, so only containers on appnet can reach them.`,cmd:'docker port web\n> 80/tcp -> 0.0.0.0:8080'}
]},

steps:S=>[
 {t:'One file, the whole app',d:`compose.yaml declares the services, how they depend on each other, and the storage they need. Here the api is your ${S.name} service, reading its connection string from the environment.`,cmd:'cat compose.yaml'},
 {t:'up: create the network',d:'Compose namespaces everything with the project name and creates a private network every service joins automatically.',cmd:'docker compose up -d\n> ✔ Network shop_default      Created'},
 {t:'Create named volumes',d:'Declared volumes are created once and reused on every up.',cmd:'> ✔ Volume "shop_dbdata"     Created'},
 {t:'Start in dependency order',d:'db starts first. Because api waits on service_healthy, Compose holds off until pg_isready passes.',cmd:'> ✔ Container shop-db-1      Healthy'},
 {t:'Then the rest',d:`api starts (listening on ${S.port}), then web, which publishes 8080. Services reach each other by service name — that’s why the connection string just says “db”.`,cmd:'> ✔ Container shop-api-1     Started\n> ✔ Container shop-web-1     Started\ndocker compose ps'},
 {t:'down: tear it all down',d:'Containers and the network are removed; the volume stays so your data survives. Add -v to wipe it too.',cmd:'docker compose down'}
]},

steps:S=>{const M=S.ms;return[
 {t:'The fat image problem',d:'Build in a single stage and the final image carries the whole toolchain — compilers, package managers, sources, caches — none of which you need at runtime.',cmd:`docker images myapp:fat\n> myapp   fat    ${mb(M.fat).replace(' ','')}`},
 {t:'Stage 1 builds',d:`The build stage has every tool it needs and produces ${M.artifact}.`,cmd:'docker build --target build -t myapp:build .'},
 {t:'Stage 2 copies just the artifact',d:`A fresh, minimal base: ${M.runtime}. COPY --from=build brings over ${M.out} and nothing else from stage 1.`,cmd:'docker build -t myapp:slim .'},
 {t:'Only the last stage ships',d:'Earlier stages are build-time scaffolding. The image you push is just the final runtime stage.',cmd:`docker images myapp\n> myapp   slim   ${mb(M.slim).replace(' ','')}\n> myapp   fat    ${mb(M.fat).replace(' ','')}`},
 {t:'Harden while you’re here',d:`Run as a non-root user (${M.user}), pin the base image by digest, and scan what you ship.`,cmd:'docker scout cves myapp:slim'}
]}},

steps:S=>[
 {t:'Images start on your machine',d:`You’ve built myapp:1.0 from the ${S.name} multi-stage Dockerfile — a few layers stored locally. Nobody else can run it yet.`,cmd:'docker build -t myapp:1.0 .'},
 {t:'Tag it with an address',d:'A full image name is registry/namespace/repo:tag. Tagging just adds another name pointing at the same image.',cmd:'docker tag myapp:1.0 ghcr.io/acme/myapp:1.0'},
 {t:'push uploads only what’s missing',d:`Layers are content-addressed. The registry already has the ${S.reg[2]} base, so only the layers above it travel.`,cmd:'docker push ghcr.io/acme/myapp:1.0\n> 3f2a9c1e: Layer already exists\n> 9b1d77a0: Pushed'},
 {t:'pull anywhere',d:'Any machine can pull the image. Each layer is verified against its sha256 digest, so what runs is exactly what you built.',cmd:'docker pull ghcr.io/acme/myapp:1.0'},
 {t:'Tags move, digests don’t',d:'Anyone can re-push :1.0 or :latest to point at a different image. A digest always means the same bytes — pin it in production.',cmd:'docker pull ghcr.io/acme/myapp@sha256:4be1c9…'}
]},

  s+=P('M315 230 L420 230',{in:2,out:3,dur:'1.4s',begin:'-.35s'});s+=P('M315 230 L420 230',{in:4,dur:'1.4s',c:'green'});
  const sub=`${S.name} :${S.port}`;
  s+=B(420,60,160,70,'api · 1',{c:'green',sub,smono:1,in:1});
  s+=B(420,195,160,70,'api · 2',{c:'green',sub,smono:1,out:3});
  s+=B(420,195,160,70,'api · 2',{c:'red',sub:'unhealthy',in:3,out:4,hl:3});
  s+=XM(558,214,9,{in:3,out:4});
  s+=T(500,290,`GET ${S.health} → 503`,{in:3,out:4,a:'middle',cls:'mono',fs:12,w:600,fill:SOL.red});
  s+=B(420,195,160,70,'api · 2',{c:'green',sub:'replacement',in:4,hl:4});
  s+=B(420,330,160,70,'api · 3',{c:'green',sub,smono:1,in:1});
  s+=B(640,175,140,110,'Orchestrator',{c:'yellow',sub:'desired 3\nactual 3',smono:1,fs:14,in:1,out:3});
  s+=B(640,175,140,110,'Orchestrator',{c:'yellow',sub:'desired 3\nactual 2',smono:1,fs:14,in:3,out:4,hl:3});
  s+=B(640,175,140,110,'Orchestrator',{c:'yellow',sub:'desired 3\nactual 3',smono:1,fs:14,in:4,hl:4});
  s+=A('M584 220 L636 220',{in:3,out:4,c:'red',label:'health ✗',lx:610,ly:208});
  s+=A('M636 240 L584 240',{in:4,c:'green',label:'replace',lx:610,ly:262});
  s+=BD(400,424,'same loop across many machines → Kubernetes / Swarm',{a:'middle',c:'ink',in:5});
  return s;},
steps:S=>[
 {t:'One container hits a ceiling',d:'A single replica means one crash takes you down, and throughput is capped at what one container can do.',cmd:`docker run -d -p 8080:${S.port} myapp:1.0`},
 {t:'Run replicas',d:'Declare how many copies you want. Replicas are identical and stateless — state lives in the database or a volume.',cmd:'docker compose up -d --scale api=3'},
 {t:'Spread the load',d:'A load balancer (nginx, Traefik, or the orchestrator’s built-in one) sends each request to a replica.',cmd:'docker compose ps     # 3 × api running'},
 {t:'A replica goes bad',d:`Its HEALTHCHECK against ${S.health} starts failing. Traffic stops flowing to it, and the orchestrator notices actual ≠ desired.`,cmd:`# in the Dockerfile:\n| HEALTHCHECK CMD wget -qO- localhost:${S.port}${S.health} || exit 1\ndocker inspect -f "{{.State.Health.Status}}" shop-api-2\n> unhealthy`},
 {t:'Reconcile to desired state',d:'The orchestrator replaces the unhealthy replica and traffic reaches all three again — nobody gets paged.',cmd:'docker service ps api     # swarm: 3/3 running'},
 {t:'Next stop: orchestration',d:'Kubernetes and Swarm run this same declare-and-reconcile loop across a whole cluster of machines. You now have the mental model.',cmd:'kubectl scale deployment/api --replicas=10'}
]}
];
LESSONS.forEach((l,i)=>l.n=i+1);

/* ---------- progress ---------- */
let done={};
try{done=JSON.parse(localStorage.getItem('lbl-done')||'{}')}catch(e){}
function saveDone(){try{localStorage.setItem('lbl-done',JSON.stringify(done))}catch(e){}updateProg();}
function updateProg(){const n=LESSONS.filter(l=>done[l.id]).length;document.getElementById('progTxt').textContent=`${n} / ${LESSONS.length} done`;document.getElementById('progBar').style.width=(n/LESSONS.length*100)+'%';}

/* ---------- views ---------- */
const app=document.getElementById('app');
let state={lesson:null,step:0,steps:[],timer:null,typer:null};

function heroArt(){
  const iso=(cy,fill,label)=>{const cx=200,w=250,h=110,d=24;
    return `<g class="lay"><polygon points="${cx-w/2},${cy} ${cx},${cy+h/2} ${cx},${cy+h/2+d} ${cx-w/2},${cy+d}" fill="${fill}" stroke="#1f1a17" stroke-width="2" style="filter:brightness(.88)"/><polygon points="${cx},${cy+h/2} ${cx+w/2},${cy} ${cx+w/2},${cy+d} ${cx},${cy+h/2+d}" fill="${fill}" stroke="#1f1a17" stroke-width="2" style="filter:brightness(.76)"/><polygon points="${cx},${cy-h/2} ${cx+w/2},${cy} ${cx},${cy+h/2} ${cx-w/2},${cy}" fill="${fill}" stroke="#1f1a17" stroke-width="2"/><text x="${cx}" y="${cy+5}" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="${label.length>17?12.5:14}" font-weight="600" fill="#1f1a17">${esc(label)}</text></g>`;};
  return `<svg viewBox="0 0 400 440">${iso(345,'#e6dccd',S.heroBase)}${iso(253,'#d3e1fb',S.depsShort)}${iso(161,'#f6e3ad','COPY . .')}${iso(69,'#f8d6c1','container (rw)')}</svg>`;
}
const stackChips=()=>STACK_ORDER.map(k=>{const x=STACKS[k];return `<button class="schip${x===S?' cur':''}" data-stack="${k}"><i class="sdot" style="background:${x.dot}"></i>${x.name}</button>`}).join('');

function renderHome(){
  stopPlay();
  const first=LESSONS.find(l=>!done[l.id])||LESSONS[0];
  app.innerHTML=`<div class="home">
   <section class="hero">
     <div>
       <div class="eyebrow">An interactive Docker course</div>
       <h1>Learn Docker,<br><em>layer by layer.</em></h1>
       <p>Ten animated diagrams that take you from “what is a container?” to replicas behind a load balancer. Step through each one, watch it change, and copy the real commands as you go.</p>
       <div class="stackrow"><span>Examples in</span>${stackChips()}</div>
       <a class="btn" href="#${first.id}">${Object.keys(done).length?'Continue':'Start'} with ${first.title} →</a>
       <a class="btn ghost" href="#${LESSONS[0].id}" style="margin-left:10px">From the top</a>
     </div>
     <div class="hero-art">${heroArt()}</div>
   </section>
   <div class="section-h"><h2>The course</h2><span>${LESSONS.reduce((a,l)=>a+l.steps(S).length,0)} steps · ~40 minutes · ${S.name} examples</span></div>
   <div class="grid">${LESSONS.map(l=>`<a class="card" href="#${l.id}"><div class="num">${String(l.n).padStart(2,'0')}</div><h3>${l.title}</h3><p>${l.lede}</p><div class="meta"><span class="tag t-${l.tag}">${l.tag}</span>${done[l.id]?'<span class="done-badge">✓ done</span>':`<span class="mono" style="color:var(--muted)">${l.steps(S).length} steps</span>`}</div></a>`).join('')}</div>
   <div class="howto">
     <div><b>Pick your stack</b><p>Node.js, .NET, Python, Java, Go or Rust — Dockerfiles, ports, build caching and multi-stage examples all follow your choice.</p></div>
     <div><b>Step, don’t scroll</b><p>Each lesson is one diagram that evolves. Use <kbd>←</kbd> <kbd>→</kbd> or the buttons, or hit Play.</p></div>
     <div><b>Real commands</b><p>Every step pairs with the command that does it. Copy them into your own terminal and try it.</p></div>
   </div></div>`;
  app.querySelectorAll('.stackrow [data-stack]').forEach(b=>b.onclick=()=>setStack(b.dataset.stack));
}

function renderLesson(l,keepStep){
  stopPlay();
  state.lesson=l;state.steps=l.steps(S);
  const prev=LESSONS[l.n-2],next=LESSONS[l.n];
  app.innerHTML=`<div class="lesson">
   <nav class="side"><h4>Lessons</h4>${LESSONS.map(x=>`<a href="#${x.id}" class="${x===l?'cur':''}"><span class="n">${String(x.n).padStart(2,'0')}</span><span>${x.title}</span>${done[x.id]?'<span class="ck">✓</span>':''}</a>`).join('')}</nav>
   <main class="main">
     <div class="crumb"><span class="tag t-${l.tag}">${l.tag}</span><span class="mono" style="font-size:12px;color:var(--muted)">LESSON ${String(l.n).padStart(2,'0')} / ${LESSONS.length}</span>
       ${l.neutral?`<span class="stackinline neutral">same for every stack</span>`:`<button class="stackinline" id="crumbStack"><i class="sdot" style="background:${S.dot}"></i>${S.name} examples ▾</button>`}</div>
     <h1>${l.title}</h1>
     <p class="lede">${l.lede}</p>
     <div class="stage">
       <div class="canvas" id="canvas"><button class="zoombtn" id="bZoom">⤢ zoom</button><svg viewBox="0 0 800 ${l.h||460}" role="img" aria-label="${l.title} diagram">${DEFS}${l.scene(S)}</svg></div>
       <div class="caption"><div class="stepno" id="stepno"></div><div id="captxt"></div></div>
       <div class="controls">
         <button class="cbtn" id="bPrev">← Back</button>
         <button class="cbtn primary" id="bNext">Next →</button>
         <button class="cbtn" id="bPlay">▶ Play</button>
         <button class="cbtn" id="bReset" title="Restart">↺</button>
         <div class="dots" id="dots">${state.steps.map((_,i)=>`<button aria-label="Step ${i+1}" data-i="${i}"></button>`).join('')}</div>
       </div>
     </div>
     <div class="term"><div class="term-bar"><i></i><i></i><i></i><span>~/demo — zsh</span><button class="copy" id="bCopy">copy</button></div><pre id="term"></pre></div>
     <div class="hint">Tip: <kbd>←</kbd> <kbd>→</kbd> to step, <kbd>space</kbd> to play.</div>
     <div class="pager">${prev?`<a href="#${prev.id}"><small>← PREVIOUS</small><b>${prev.title}</b></a>`:'<span></span>'}${next?`<a class="next" href="#${next.id}"><small>NEXT →</small><b>${next.title}</b></a>`:`<a class="next" href="#home"><small>FINISHED 🎉</small><b>Back to all lessons</b></a>`}</div>
   </main></div>`;
  document.getElementById('bPrev').onclick=()=>{stopPlay();go(state.step-1)};
  document.getElementById('bNext').onclick=()=>{stopPlay();go(state.step+1)};
  document.getElementById('bReset').onclick=()=>{stopPlay();go(0)};
  document.getElementById('bPlay').onclick=togglePlay;
  document.getElementById('dots').onclick=e=>{const i=e.target.dataset.i;if(i!=null){stopPlay();go(+i)}};
  document.getElementById('bCopy').onclick=copyCmds;
  document.getElementById('bZoom').onclick=()=>{const c=document.getElementById('canvas');const z=c.classList.toggle('zoom');document.getElementById('bZoom').textContent=z?'⤡ fit':'⤢ zoom';};
  const cs=document.getElementById('crumbStack');if(cs)cs.onclick=e=>{e.stopPropagation();toggleMenu();};
  if(keepStep==null)window.scrollTo(0,0);
  go(keepStep||0,true);
}

function go(i,first){
  const l=state.lesson;if(!l)return;
  const steps=state.steps;
  i=Math.max(0,Math.min(steps.length-1,i));
  state.step=i;
  const svg=app.querySelector('.canvas svg');
  if(first)void svg.getBoundingClientRect();
  svg.querySelectorAll('[data-in],[data-out]').forEach(el=>{
    const a=+(el.dataset.in||0),b=el.dataset.out!=null?+el.dataset.out:1e9;
    el.classList.toggle('on',i>=a&&i<b);
  });
  svg.querySelectorAll('[data-hl]').forEach(el=>{
    const on=el.dataset.hl.split(' ').map(Number).includes(i);
    if(on&&!el.classList.contains('hl'))el.classList.add('hl');else if(!on)el.classList.remove('hl');
  });
  const st=steps[i];
  document.getElementById('stepno').innerHTML=`${i+1}<small>of ${steps.length}</small>`;
  document.getElementById('captxt').innerHTML=`<div class="fade"><h3>${esc(st.t)}</h3><p>${esc(st.d)}</p></div>`;
  document.getElementById('bPrev').disabled=i===0;
  const last=i===steps.length-1;
  document.getElementById('bNext').disabled=last;
  [...document.querySelectorAll('#dots button')].forEach((b,k)=>{b.className=k<i?'past':k===i?'cur':''});
  renderTerm(i);
  if(last&&!done[l.id]){done[l.id]=1;saveDone();const a=app.querySelector(`.side a[href="#${l.id}"]`);if(a&&!a.querySelector('.ck'))a.insertAdjacentHTML('beforeend','<span class="ck">✓</span>');}
}

/* terminal line kinds: "> " output, "# " comment, "| " file content, otherwise a shell command */
function lineHTML(line){
  if(line.startsWith('> '))return `<span class="o">${esc(line.slice(2))}</span>`;
  if(line.startsWith('#'))return `<span class="c">${esc(line)}</span>`;
  if(line.startsWith('| '))return `<span class="f">${esc(line.slice(2))}</span>`;
  const m=line.match(/^(.*?)(\s+#.*)?$/);
  return `<span class="p">$</span> ${esc(m[1])}${m[2]?`<span class="c">${esc(m[2])}</span>`:''}`;
}
const isCmd=x=>!/^(> |#|\| )/.test(x);
function renderTerm(i){
  clearInterval(state.typer);
  const steps=state.steps,term=document.getElementById('term');
  const prevLines=[];steps.slice(0,i).forEach(s=>{if(s.cmd)prevLines.push(...s.cmd.split('\n'))});
  const cur=steps[i].cmd?steps[i].cmd.split('\n'):[];
  const old=prevLines.slice(-8).map(x=>`<div class="old">${lineHTML(x)}</div>`).join('');
  const k=cur.findIndex(isCmd);
  if(k<0){term.innerHTML=old+cur.map(x=>`<div>${lineHTML(x)}</div>`).join('')+(cur.length?'':`<div><span class="p">$</span> <span class="cursor"></span></div>`);term.scrollTop=term.scrollHeight;return;}
  const before=cur.slice(0,k).map(x=>`<div>${lineHTML(x)}</div>`).join('');
  const full=cur[k],after=cur.slice(k+1).map(x=>`<div>${lineHTML(x)}</div>`).join('');
  let n=0;
  const tick=()=>{
    n=Math.min(full.length,n+2);
    const fin=n>=full.length;
    term.innerHTML=old+before+`<div>${fin?lineHTML(full):`<span class="p">$</span> ${esc(full.slice(0,n))}<span class="cursor"></span>`}</div>`+(fin?after:'');
    term.scrollTop=term.scrollHeight;
    if(fin)clearInterval(state.typer);
  };
  tick();state.typer=setInterval(tick,22);
}
function copyCmds(){
  const st=state.steps[state.step];const b=document.getElementById('bCopy');
  const txt=(st.cmd||'').split('\n').filter(isCmd).join('\n');
  const say=(t,ms)=>{b.textContent=t;setTimeout(()=>b.textContent='copy',ms||1200)};
  if(!txt){say('nothing to copy');return;}
  try{navigator.clipboard.writeText(txt).then(()=>say('copied ✓'),()=>say('copy blocked',1400))}catch(e){say('copy blocked',1400)}
}
function togglePlay(){
  if(state.timer){stopPlay();return;}
  const n=state.steps.length;if(state.step>=n-1)go(0);
  document.getElementById('bPlay').textContent='❚❚ Pause';
  state.timer=setInterval(()=>{if(state.step>=n-1){stopPlay();return;}go(state.step+1)},3600);
}
function stopPlay(){clearInterval(state.timer);state.timer=null;const b=document.getElementById('bPlay');if(b)b.textContent='▶ Play';}

/* ---------- stack picker ---------- */
const menu=document.getElementById('stackMenu');
function paintStackBtn(){
  document.getElementById('stackDot').style.background=S.dot;
  document.getElementById('stackName').textContent=S.name;
  menu.innerHTML=STACK_ORDER.map(k=>{const x=STACKS[k];return `<button data-stack="${k}" class="${x===S?'cur':''}"><i class="sdot" style="background:${x.dot}"></i><span>${x.name}<small>${x.sub}</small></span>${x===S?'<b>✓</b>':''}</button>`}).join('');
}
function toggleMenu(force){const open=force!=null?force:menu.hidden;menu.hidden=!open;document.getElementById('stackBtn').setAttribute('aria-expanded',open);}
document.getElementById('stackBtn').onclick=e=>{e.stopPropagation();toggleMenu();};
menu.onclick=e=>{const b=e.target.closest('[data-stack]');if(b)setStack(b.dataset.stack);};
document.addEventListener('click',e=>{if(!menu.hidden&&!e.target.closest('.stackpick'))toggleMenu(false);});
function setStack(id){
  toggleMenu(false);
  if(!STACKS[id]||STACKS[id]===S)return;
  S=STACKS[id];
  try{localStorage.setItem('lbl-stack',id)}catch(e){}
  paintStackBtn();
  if(state.lesson)renderLesson(state.lesson,state.step);else renderHome();
  const t=document.createElement('div');t.className='toast';t.textContent=`Examples switched to ${S.name}`;document.body.appendChild(t);setTimeout(()=>t.remove(),2300);
}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape')toggleMenu(false);
  if(!state.lesson||!document.getElementById('bNext'))return;
  if(e.target.closest&&e.target.closest('input,textarea,button'))return;
  if(e.key==='ArrowRight'){stopPlay();go(state.step+1);e.preventDefault();}
  else if(e.key==='ArrowLeft'){stopPlay();go(state.step-1);e.preventDefault();}
  else if(e.key===' '){togglePlay();e.preventDefault();}
});

function route(){
  const id=location.hash.slice(1);
  const l=LESSONS.find(x=>x.id===id);
  if(l)renderLesson(l);else{state.lesson=null;renderHome();window.scrollTo(0,0);}
}
window.addEventListener('hashchange',route);
paintStackBtn();updateProg();route();
</script>
